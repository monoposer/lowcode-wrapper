# Run from repo root: docker compose -f deploy/docker-compose.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wrapper
      POSTGRES_PASSWORD: wrapper
      POSTGRES_DB: wrapper_meta
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - dataspan-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrapper -d wrapper_meta"]
      interval: 3s
      timeout: 3s
      retries: 10

  dataspan:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${DATASPAN_IMAGE:-dataspan:local}
    ports:
      - "${PORT:-3020}:3020"
    environment:
      WRAPPER_STORE_MODE: ${WRAPPER_STORE_MODE:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgresql://wrapper:wrapper@postgres:5432/wrapper_meta?sslmode=disable}
      DATASPAN_VAULT_KEY: ${DATASPAN_VAULT_KEY:?set DATASPAN_VAULT_KEY in .env}
      WRAPPER_DRIVERS_FILE: ${WRAPPER_DRIVERS_FILE:-/config/drivers.yaml}
      PORT: "3020"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DATASPAN_ANON_KEY: ${DATASPAN_ANON_KEY:-}
      DATASPAN_SERVICE_KEY: ${DATASPAN_SERVICE_KEY:-}
      DATASPAN_JWT_SECRET: ${DATASPAN_JWT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # File mode: uncomment and mount drivers.yaml
    # volumes:
    #   - ../drivers.yaml:/config/drivers.yaml:ro

volumes:
  dataspan-pg-data:
