name: Tag Release on Merge

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag from VERSION
        run: |
          set -euo pipefail

          if git tag --points-at HEAD | grep -qE '^v[0-9]'; then
            echo "Commit already tagged, skipping."
            exit 0
          fi

          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: $VERSION (expected MAJOR.MINOR.PATCH)" >&2
            exit 1
          fi

          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists. Bump VERSION before merging to main."
            exit 0
          fi

          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin "$TAG"
          echo "Tagged ${TAG} — convert-release and docker-publish will run on this tag."
