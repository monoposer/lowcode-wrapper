name: Release CLI Binaries

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve version
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(tr -d '\n' < VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build convert binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          out="dist/dataspan-convert-${GOOS}-${GOARCH}${ext}"
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w \
              -X github.com/monoposer/dataspan/internal/version.Version=${VERSION} \
              -X github.com/monoposer/dataspan/internal/version.Commit=${GITHUB_SHA:0:7} \
              -X github.com/monoposer/dataspan/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "$out" ./cmd/convert
          if [ "$GOOS" != "windows" ]; then chmod +x "$out"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: dataspan-convert-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/dataspan-convert-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
