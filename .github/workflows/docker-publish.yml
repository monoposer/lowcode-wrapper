name: Publish Docker Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "server_image=${{ secrets.DOCKERHUB_USERNAME }}/dataspan" >> "$GITHUB_OUTPUT"
          echo "cli_image=${{ secrets.DOCKERHUB_USERNAME }}/dataspan-cli" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || 'unknown' }}
          tags: |
            ${{ steps.meta.outputs.server_image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.server_image }}:latest

      - name: Build and push CLI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.cli
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || 'unknown' }}
          tags: |
            ${{ steps.meta.outputs.cli_image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.cli_image }}:latest
